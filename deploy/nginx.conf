server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Never expose a dedicated env.js page (config is inlined into index.html).
  location ~* ^/env\.js(/|$) {
    default_type text/plain;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    return 404;
  }

  # Never serve secrets / VCS (even if they land in the html root)
  location ~* /\.(env|git) {
    deny all;
    return 404;
  }

  location ~ /\.(?!well-known) {
    deny all;
    return 404;
  }

  location ~* \.(?:bak|old|orig|sql|pem|key|crt)$ {
    deny all;
    return 404;
  }

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Immutable hashed assets from Vite
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # INN → company (Node sidecar; avoids Edge Function on self-hosted Supabase)
  location = /api/company-by-inn {
    proxy_pass http://127.0.0.1:3099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 45s;
  }

  # Messenger outbound stub (replaced by proxy when MESSENGER_UPSTREAM is set).
  # Prevents SPA try_files from answering POST with 405.
  location /api/messenger/ {
    default_type application/json;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    if ($request_method = OPTIONS) {
      return 204;
    }
    return 503 '{"ok":false,"error":"messenger_api_unavailable"}';
  }

  # Optional messenger webhook + outbound proxy override is injected at container start when
  # MESSENGER_UPSTREAM is set (see deploy/docker-entrypoint.sh).

  # SPA: React Router
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Security headers (basic)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
