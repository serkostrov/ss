services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
      VITE_APP_URL: ${VITE_APP_URL:-}
      VITE_TELEGRAM_BOT_URL: ${VITE_TELEGRAM_BOT_URL:-}
      VITE_MAX_BOT_URL: ${VITE_MAX_BOT_URL:-}
      VITE_MESSENGER_API_URL: ${VITE_MESSENGER_API_URL:-}
      # Set only when messenger is reachable on this Docker network, e.g. http://messenger:8787
      MESSENGER_UPSTREAM: ${MESSENGER_UPSTREAM:-}
    # Dokploy Traefik: map domain to this service on port 80
    # To proxy webhooks via web: start messenger service and set MESSENGER_UPSTREAM=http://messenger:8787

  messenger:
    build:
      context: .
      dockerfile: Dockerfile.messenger
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      # Public HTTPS origin that reaches nginx → /webhooks/* → this service
      PUBLIC_WEBHOOK_BASE_URL: ${PUBLIC_WEBHOOK_BASE_URL}
      PORT: 8787
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SMTPBZ_API_KEY: ${SMTPBZ_API_KEY:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-АПСС(ЭР)}
      APP_URL: ${APP_URL:-}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
